name: Supabase Keepalive

# Jaga project Supabase free tier agar tidak di-pause (idle 7 hari).
# Cron harian mengirim 1 query REST API (anon key) -> dihitung sebagai aktivitas,
# sehingga timer idle otomatis reset terus-menerus.
on:
  schedule:
    - cron: '23 4 * * *'   # tiap hari 04:23 UTC (acak, hindari puncak bersama)
  workflow_dispatch: {}    # bisa dijalankan manual dari tab Actions

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping setiap project Supabase
        env:
          PROJECTS: ${{ secrets.SUPABASE_PROJECTS }}
        run: |
          echo "$PROJECTS" | jq -c '.[]' | while read -r p; do
            url=$(echo "$p" | jq -r '.url')
            key=$(echo "$p" | jq -r '.key')
            echo "-> Ping $url"
            code=$(curl -sS -o /dev/null -w "%{http_code}" \
              -H "apikey: $key" \
              -H "Authorization: Bearer $key" \
              "$url/rest/v1/transaksi?select=id&limit=1")
            echo "   HTTP $code"
          done
